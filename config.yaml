# Central configuration: edit this instead of touching code.
data:
  path: data/raw/preventative_maintainance_dataset.csv        # CSV used for training
  target: failure_within_7_days    # name of the label column
  test_size: 0.3
  random_state: 1
  drop_cols: 
      - record_id
      - timestamp
      - mine_id
      - conveyor_id
      - idler_id
  n_components: 0.95 

model:
  type: random_forest           # random_forest | logistic_regression
  params:
    n_estimators: 100
    max_depth: 5

artifacts:
  model_dir: models             # versioned models are saved here
  report_dir: reports           # metrics JSON files are saved here
