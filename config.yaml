# Central configuration: edit this instead of touching code.
data:
  path: data/raw/preventative_maintainance_dataset.csv        # CSV used for training
  target: failure_within_7_days    # name of the label column
  test_size: 0.3
  random_state: 1
  drop_cols: 
      - record_id
      - timestamp
      - mine_id
      - conveyor_id
      - idler_id
  n_components: 0.95 

model:
  task: classification           # random_forest | logistic_regression
  metric: f1
  time_budget: 120
  estimator_list:
      - lgbm
      - xgboost
      - rf
      - extra_tree
      - lrl1  
  
  eval_method: cv
  n_splits: 5
  verbose: 1

mlflow:
  experiment_name: Coal_Mine_Predictive_Maintenance
  tracking_uri: mlruns
  model_name: CoalMineFailureModel
  model_artifact: final_model

evaluation:
  positive_label: 1
  primary_metric: recall

artifacts:
  model_dir: models
  report_dir: reports